name: CI

on:
  pull_request:
  push:
    branches: [main, develop, release]

permissions:
  contents: read

jobs:
  java-8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - name: Qualify implementation and package without scale run
        env:
          SOMA_I8_SKIP_BENCHMARK: '1'
        run: ./scripts/qualify-i8.sh
