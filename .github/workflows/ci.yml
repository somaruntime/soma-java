name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-8-governance:
    name: Java 8 governance and reactor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up full JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
          cache: maven

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Verify generated workspace cleanliness
        run: git diff --exit-code
