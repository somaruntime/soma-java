name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-8-governance:
    name: Java 8 governance and reactor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up full JDK 8
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: zulu
          java-version: '8.0.492+9'
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Install verified ripgrep
        env:
          SOMA_TOOLCHAIN_ROOT: ${{ runner.temp }}/soma-toolchains
        run: |
          ripgrep=$(./scripts/setup/install-ripgrep-linux-x64.sh)
          dirname "$ripgrep" >> "$GITHUB_PATH"

      - name: Verify exact supported toolchain
        run: ./scripts/check-toolchain.sh

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Verify generated workspace cleanliness
        run: git diff --exit-code
