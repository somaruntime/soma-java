name: Release qualification (non-publishing)

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - name: Run non-publishing release qualification
        env:
          SOMA_BENCHMARK_ROWS: '1000000'
          SOMA_BENCHMARK_RUNS: '1'
          SOMA_BENCHMARK_PARALLELISM: '8'
        run: ./scripts/qualify.sh
      - name: Confirm no publication surface
        run: grep -q '^publication=none$' target/package/provenance.properties
