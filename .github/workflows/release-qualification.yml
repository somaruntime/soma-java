name: Release qualification (non-publishing)

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - name: Run non-publishing release qualification
        env:
          SOMA_BENCHMARK_ROWS: '1000000'
          SOMA_BENCHMARK_RUNS: '1'
          SOMA_BENCHMARK_PARALLELISM: '8'
        run: ./scripts/qualify.sh
      - name: Confirm no publication surface
        run: grep -q '^publication=none$' target/package/provenance.properties
