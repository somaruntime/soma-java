name: Release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-source-qualification:
    name: Private-source package and security qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure qualification evidence root
        run: |
          printf 'SOMA_RELEASE_EVIDENCE_ROOT=%s\n' \
            "$RUNNER_TEMP/soma-java-release-evidence" >> "$GITHUB_ENV"

      # setup-java's Corretto provider only accepts a major version. The
      # repository installer pins and verifies the exact archive first.
      - name: Download verified exact Corretto JDK
        id: corretto
        env:
          SOMA_TOOLCHAIN_ROOT: ${{ runner.temp }}/soma-toolchains
        run: |
          archive=$(./scripts/setup/install-corretto8-linux-x64.sh --archive-only)
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Set up exact supported JDK and Maven cache
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: jdkfile
          jdkFile: ${{ steps.corretto.outputs.archive }}
          java-version: '8.0.502+7'
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Install verified ripgrep
        env:
          SOMA_TOOLCHAIN_ROOT: ${{ runner.temp }}/soma-toolchains
        run: |
          ripgrep=$(./scripts/setup/install-ripgrep-linux-x64.sh)
          dirname "$ripgrep" >> "$GITHUB_PATH"

      - name: Verify exact supported toolchain
        run: ./scripts/check-toolchain.sh

      - name: Initialize immutable candidate evidence
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$SOMA_RELEASE_EVIDENCE_ROOT"
          . ./scripts/lib/project-version.sh
          version=$(soma_project_version)
          {
            printf 'format=soma-java-private-source-candidate-v1\n'
            printf 'releaseProfile=private-github-source\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'runId=%s\n' "$GITHUB_RUN_ID"
            printf 'runAttempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'version=%s\n' "$version"
          } >"$SOMA_RELEASE_EVIDENCE_ROOT/candidate.properties"

      - name: Install verified OSV-Scanner
        env:
          SOMA_TOOLCHAIN_ROOT: ${{ runner.temp }}/soma-toolchains
        run: |
          scanner=$(./scripts/setup/install-osv-scanner.sh)
          printf 'OSV_SCANNER=%s\n' "$scanner" >> "$GITHUB_ENV"

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Verify reproducible release-shaped package
        run: ./scripts/package-smoke.sh

      - name: Verify curated source package
        run: ./scripts/source-package-smoke.sh

      - name: Run dependency, license and vulnerability scan
        run: ./scripts/security-release-scan.sh

      - name: Verify generated workspace cleanliness
        run: git diff --exit-code

      - name: Seal private-source qualification evidence
        run: |
          package_dir=$(find "$SOMA_RELEASE_EVIDENCE_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'package-smoke.*')
          source_dir=$(find "$SOMA_RELEASE_EVIDENCE_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'source-package-smoke.*')
          security_dir=$(find "$SOMA_RELEASE_EVIDENCE_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'security-release-scan.*')
          test "$(printf '%s\n' "$package_dir" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$source_dir" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$security_dir" | sed '/^$/d' | wc -l)" -eq 1
          . ./scripts/lib/project-version.sh
          version=$(soma_project_version)
          grep -Fqx "commit=$GITHUB_SHA" "$SOMA_RELEASE_EVIDENCE_ROOT/candidate.properties"
          grep -Fqx "commit=$GITHUB_SHA" "$package_dir/provenance.properties"
          grep -Fqx 'dirty=false' "$package_dir/provenance.properties"
          grep -Fqx "artifactVersion=$version" "$package_dir/provenance.properties"
          grep -Fqx "commit=$GITHUB_SHA" "$source_dir/provenance.properties"
          grep -Fqx 'dirty=false' "$source_dir/provenance.properties"
          grep -Fqx "artifactVersion=$version" "$source_dir/provenance.properties"
          grep -Fqx 'projectFactsIncluded=false' "$source_dir/provenance.properties"
          grep -Fqx 'rawEvidenceIncluded=false' "$source_dir/provenance.properties"
          grep -Fqx 'agentSkillIncluded=false' "$source_dir/provenance.properties"
          grep -Fqx 'archiveBuildVerified=true' "$source_dir/provenance.properties"
          grep -Fqx "commit=$GITHUB_SHA" "$security_dir/summary.properties"
          grep -Fqx 'dirty=false' "$security_dir/summary.properties"
          grep -Fqx "artifactVersion=$version" "$security_dir/summary.properties"
          (
            cd "$SOMA_RELEASE_EVIDENCE_ROOT"
            find . -type f ! -name evidence-checksums.sha256 -print |
              LC_ALL=C sort |
              while IFS= read -r evidence_file; do
                sha256sum "$evidence_file"
              done >evidence-checksums.sha256
          )

      - name: Retain private-source qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-source-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/soma-java-release-evidence
          if-no-files-found: error
          retention-days: 90
